name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm run test:ci
      - name: Start Next server for Lighthouse
        if: github.event_name == 'push'
        run: |
          # start the server in background for LHCI to hit
          npm run start &
          # wait for it to be reachable
          n=0; until curl -sSf http://localhost:3000 >/dev/null || [ $n -ge 30 ]; do n=$((n+1)); sleep 1; done
      - name: Lighthouse CI (optional)
        if: github.event_name == 'push'
        uses: treosh/lighthouse-ci-action@v8
        with:
          urls: 'http://localhost:3000'
          numberOfRuns: 1
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}

  preview:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build artifacts
        run: echo "Built in previous job"
